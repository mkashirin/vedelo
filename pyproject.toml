[project]
name = "vedelo"
version = "0.1.0"
description = "Vehicle Detection with YOLO"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub==2.4.0",
    "matplotlib==3.11.2",
    "polars==2.1.0",
    # Must match the libtorch version required by runtime's tch 0.23.
    "torch==2.10.0",
    "ultralytics==8.4.209",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
export = [
    "colorama==0.4.6",
    "flatbuffers==25.12.19",
    "lap==0.5.14",
    "ml-dtypes==0.6.0",
    "onnx==1.23.2",
    "onnxruntime-gpu==1.31.1",
    "onnxslim==0.1.99",
    "protobuf==7.36.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["vedelo"]
include = ["assets"]

[tool.ty.rules]
no-matching-overload = "ignore"
