[project]
name = "vedelo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.10.0",
    "ultralytics>=8.4.14",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "ty>=0.0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["vedelo"]
include = ["static"]

[tool.ty.rules]
no-matching-overload = "ignore"
